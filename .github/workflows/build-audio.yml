name: Build Worldview Weekly Audio

on:
  push:
    branches: [main]
    paths:
      - 'audio/current.txt'
      - 'scripts/build_audio.py'
      - '.github/workflows/build-audio.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize runs: two builds racing to publish would fight over the rebase
# in the commit step. Queue them instead.
concurrency:
  group: build-audio
  cancel-in-progress: false

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow clone: the full history carries ~172 MB of past MP3s
          # that the build never reads. The commit step below fetches more
          # history only if a rebase actually needs it.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build audio and podcast RSS
        env:
          KOKORO_VOICE: am_michael
          KOKORO_SPEED: '1.0'
        run: python scripts/build_audio.py

      - name: Commit generated audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/episodes podcast.xml
          git diff --cached --quiet && exit 0
          # main is protected by the "Protect main" ruleset (PR required,
          # no bypass), so a direct push is rejected. Publish through a
          # pull request instead; it needs 0 approvals and merges at once.
          branch="publish/audio-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "Publish Worldview Weekly audio"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Publish Worldview Weekly audio" \
            --body "Automated audio build from audio/current.txt."
          gh pr merge "$branch" --merge --delete-branch
